<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Arena — Login</title>
<style>
  :root {
    --ink: #16213e;
    --paper: #f5f3ee;
    --accent: #e94560;
    --accent2: #0f3460;
    --gold: #ffb703;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--accent2), var(--ink));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: white;
  }
  .logo {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .logo span { color: var(--gold); }
  .tagline {
    opacity: 0.75;
    font-size: 0.95rem;
    margin-bottom: 40px;
    text-align: center;
  }
  .card {
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    max-width: 340px;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .card p { font-size: 0.85rem; color: #666; margin-bottom: 22px; }

  #googleBtn { display: flex; justify-content: center; }
  #gsiButtonBox { min-height: 44px; }

  .status {
    margin-top: 16px;
    font-size: 0.8rem;
    color: #999;
  }

  #welcomeBox {
    display: none;
    margin-top: 10px;
  }
  #welcomeBox img {
    width: 56px; height: 56px; border-radius: 50%;
    margin-bottom: 8px;
  }
  #welcomeBox .name { font-weight: 700; }
  #welcomeBox .email { font-size: 0.8rem; color: #777; }
  #continueBtn {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .note {
    max-width: 340px;
    margin-top: 24px;
    font-size: 0.75rem;
    opacity: 0.6;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="logo">🏆 Skill <span>Arena</span></div>
<div class="tagline">Play. Compete. Win real prizes.</div>

<div class="card">
  <h2>Welcome</h2>
  <p>Sign in to join tournaments and track your winnings</p>

  <div id="googleBtn">
    <div id="gsiButtonBox"></div>
  </div>

  <div id="welcomeBox">
    <img id="userPic" src="" alt="">
    <div class="name" id="userName"></div>
    <div class="email" id="userEmail"></div>
    <button id="continueBtn" onclick="goHome()">Continue to Skill Arena →</button>
  </div>

  <div class="status" id="statusMsg">Not signed in yet</div>
</div>

<div class="note">
  By continuing you agree that this app runs skill-based tournaments only — no entry fees, no betting.
</div>

<script>
  const GOOGLE_CLIENT_ID = "806595187695-v9ruios0nhq98bnb9cjbejvk5rbar9jg.apps.googleusercontent.com";

  function initGoogle() {
    if (typeof google === 'undefined' || !google.accounts) {
      document.getElementById('statusMsg').textContent =
        'Could not load Google Sign-In — check your internet connection and reload.';
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById("gsiButtonBox"),
      { theme: "outline", size: "large", width: 260 }
    );
  }
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()" onerror="document.getElementById('statusMsg').textContent='Failed to load Google Sign-In script. Check internet connection.'"></script>
<script>
  // Decode the JWT Google gives us, just to show the user's
  // name/photo here. The Worker backend will independently verify
  // this token (never trust a client-decoded token for real balance
  // logic) once we build that part.
  function decodeJwt(token) {
    const payload = token.split('.')[1];
    return JSON.parse(decodeURIComponent(escape(atob(payload.replace(/-/g,'+').replace(/_/g,'/')))));
  }

  function handleCredentialResponse(response) {
    const user = decodeJwt(response.credential);

    document.getElementById('googleBtn').style.display = 'none';
    document.getElementById('welcomeBox').style.display = 'block';
    document.getElementById('userPic').src = user.picture;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('statusMsg').textContent = 'Signed in ✓';

    // Save the raw token + basic profile locally so home.html can
    // read it. The Worker will verify the token itself later.
    localStorage.setItem('skillarena_token', response.credential);
    localStorage.setItem('skillarena_user', JSON.stringify(user));
  }

  function goHome() {
    window.location.href = 'home.html';
  }
</script>

</body>
</html>
