<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoinTap</title>

<!-- Monetag Verification - ISKO KABHI MAT HATANA -->
<meta name="monetag" content="caa310ddd4f7365d8c92b01c19834ebb">

<style>
  :root {
    --ink: #0f2a1f;
    --paper: #f4faf3;
    --leaf: #1f6f4a;
    --leaf-dark: #144a31;
    --gold: #d4a017;
    --card: #ffffff;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(160deg, var(--leaf), var(--leaf-dark));
    color: white;
    padding: 28px 20px 60px;
    text-align: center;
    border-radius: 0 0 32px 32px;
  }
  header .brand { font-size: 1.6rem; font-weight: 700; }
  header .tagline { margin-top: 6px; opacity: 0.85; font-size: 0.95rem; }
  .balance-card {
    max-width: 420px;
    margin: -40px auto 0;
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(15, 42, 31, 0.15);
    text-align: center;
  }
  .balance-label { font-size: 0.85rem; color: #6b7c74; }
  .balance-amount { font-size: 2.4rem; font-weight: 700; color: var(--gold); margin: 4px 0 2px; }
  .balance-sub { font-size: 0.8rem; color: #8a998f; }
  main { max-width: 420px; margin: 24px auto; padding: 0 20px 40px; }
  .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 14px; }
  .btn-primary { background: var(--leaf); color: white; }
  .btn-google { background: white; color: var(--ink); border: 1px solid #d9e3dd; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-google svg { width: 18px; height: 18px; }
  .status { text-align: center; font-size: 0.85rem; color: #6b7c74; margin-bottom: 18px; }
  .withdraw-note { background: #fff8e6; border: 1px solid #f1e0a3; border-radius: 12px; padding: 14px; font-size: 0.85rem; color: #6b5a10; }
</style>
</head>
<body>
<header>
  <div class="brand">🪙 CoinTap</div>
  <div class="tagline">Watch. Earn. Withdraw.</div>
</header>
<div class="balance-card">
  <div class="balance-label">Your balance</div>
  <div class="balance-amount">Rs. 0</div>
  <div class="balance-sub">Sign in to start earning</div>
</div>
<main>
  <div class="status">Not signed in</div>
  <button class="btn btn-google">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.9 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.9 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14.1-5l-6.5-5.5C29.5 35.4 26.9 36 24 36c-5.4 0-9.9-3.4-11.5-8.2l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.5 36 44 30.5 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
    Continue with Google
  </button>
  <button class="btn btn-primary" disabled>▶ Watch Ad & Earn</button>
  <div class="withdraw-note">
    Withdrawals available for Pakistan (JazzCash, EasyPaisa) once your balance reaches the minimum. More countries coming soon.
  </div>
</main>
</body>
</html>
